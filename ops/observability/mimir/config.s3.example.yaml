# Production-oriented Mimir example. Fill in the bucket, region, and credentials
# through your runtime secret mechanism before deploying.
multitenancy_enabled: false

target: all

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: info

common:
  storage:
    backend: s3
    s3:
      endpoint: s3.${AWS_REGION}.amazonaws.com
      region: ${AWS_REGION}
      bucket_name: ${MIMIR_S3_BUCKET}
      access_key_id: ${AWS_ACCESS_KEY_ID}
      secret_access_key: ${AWS_SECRET_ACCESS_KEY}

blocks_storage:
  backend: s3
  s3:
    endpoint: s3.${AWS_REGION}.amazonaws.com
    region: ${AWS_REGION}
    bucket_name: ${MIMIR_S3_BUCKET}
    access_key_id: ${AWS_ACCESS_KEY_ID}
    secret_access_key: ${AWS_SECRET_ACCESS_KEY}
  tsdb:
    dir: /data/mimir/tsdb

compactor:
  data_dir: /data/mimir/compactor

ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: memberlist

distributor:
  ring:
    kvstore:
      store: memberlist

ruler:
  rule_path: /data/mimir/rules
  ring:
    kvstore:
      store: memberlist

ruler_storage:
  backend: s3
  s3:
    endpoint: s3.${AWS_REGION}.amazonaws.com
    region: ${AWS_REGION}
    bucket_name: ${MIMIR_RULER_S3_BUCKET}
    access_key_id: ${AWS_ACCESS_KEY_ID}
    secret_access_key: ${AWS_SECRET_ACCESS_KEY}

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: memberlist

memberlist:
  join_members:
    - mimir-gossip-ring

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 1000000
  max_global_series_per_user: 5000000

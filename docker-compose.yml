x-loki-logging: &loki-logging
  driver: fluentd
  options:
    fluentd-address: localhost:24224
    fluentd-async-connect: "true"
    fluentd-retry-wait: "1s"
    fluentd-max-retries: "60"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gam_trade
      POSTGRES_PASSWORD: gam_trade_secure_pass
      POSTGRES_DB: gam_trade_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gam_trade -d gam_trade_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-api:
    build:
      context: .
      dockerfile: rust/services/user-api/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gam_trade:gam_trade_secure_pass@postgres:5432/gam_trade_dev
      REDIS_URL: redis://redis:6379
      APP_ENV: local-prod-like
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: user-api
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.01"
      RUST_LOG: info
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: user-api

  cms-api:
    build:
      context: .
      dockerfile: rust/services/cms-api/Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gam_trade:gam_trade_secure_pass@postgres:5432/gam_trade_dev
      REDIS_URL: redis://redis:6379
      APP_ENV: local-prod-like
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: cms-api
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "0.01"
      RUST_LOG: info
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: cms-api

  order-worker:
    build:
      context: .
      dockerfile: rust/workers/order/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gam_trade:gam_trade_secure_pass@postgres:5432/gam_trade_dev
      REDIS_URL: redis://redis:6379
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: order-worker

  payment-worker:
    build:
      context: .
      dockerfile: rust/workers/payment/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gam_trade:gam_trade_secure_pass@postgres:5432/gam_trade_dev
      REDIS_URL: redis://redis:6379
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: payment-worker

  notification-worker:
    build:
      context: .
      dockerfile: rust/workers/notification/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gam_trade:gam_trade_secure_pass@postgres:5432/gam_trade_dev
      REDIS_URL: redis://redis:6379
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: notification-worker

  user-web:
    build:
      context: .
      dockerfile: apps/user/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      user-api:
        condition: service_started
    environment:
      USER_API_URL: http://user-api:8080
      NEXT_PUBLIC_API_URL: http://user-api:8080
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: user-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-web:
    build:
      context: .
      dockerfile: apps/admin/web/Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      cms-api:
        condition: service_started
    environment:
      CMS_API_URL: http://cms-api:8081
      NEXT_PUBLIC_CMS_API_URL: http://cms-api:8081
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: admin-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  user-app:
    build:
      context: .
      dockerfile: apps/user/app/Dockerfile
    ports:
      - "8082:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    depends_on:
      user-api:
        condition: service_started
    environment:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"
      USER_API_URL: http://user-api:8080
    logging:
      <<: *loki-logging
      options:
        fluentd-address: localhost:24224
        fluentd-async-connect: "true"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "60"
        tag: user-app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:latest
    command: -c /fluent-bit/etc/fluent-bit.conf
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - ./ops/observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    depends_on:
      loki:
        condition: service_started

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./ops/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./ops/observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"
    ports:
      - "3200:3200"
    volumes:
      - ./ops/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      mimir:
        condition: service_started

  mimir:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir/config.yaml"]
    user: "0"
    ports:
      - "9009:9009"
    volumes:
      - ./ops/observability/mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir_data:/data/mimir

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
      mimir:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  alloy_data:
  loki_data:
  tempo_data:
  prometheus_data:
  mimir_data:
  grafana_data:

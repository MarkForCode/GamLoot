name: Terraform AWS

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/terraform-aws.yml"
      - "infra/terraform/**"
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/terraform-aws.yml"
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Terraform environment to target"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: dev
      apply:
        description: "Apply the Terraform plan"
        required: true
        type: boolean
        default: false

concurrency:
  group: terraform-aws-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TF_IN_AUTOMATION: true
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'prod' || 'dev' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Select environment
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            environment="${{ inputs.environment }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            environment="prod"
          else
            environment="dev"
          fi
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"

      - name: Check AWS Terraform role
        id: aws_role
        shell: bash
        env:
          AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN || secrets.AWS_TERRAFORM_ROLE_ARN }}
        run: |
          if [[ -n "${AWS_TERRAFORM_ROLE_ARN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "role_arn=${AWS_TERRAFORM_ROLE_ARN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=false" >> "$GITHUB_OUTPUT"
          {
            echo "## Terraform AWS"
            echo
            echo "Skipped Terraform plan because \`AWS_TERRAFORM_ROLE_ARN\` is not configured for the \`${{ steps.target.outputs.environment }}\` GitHub environment."
            echo
            echo "Set it as an environment variable or secret before running real AWS plans."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply }}" == "true" ]]; then
            echo "::error::AWS_TERRAFORM_ROLE_ARN is required for manual apply."
            exit 1
          fi

      - name: Configure AWS credentials
        if: steps.aws_role.outputs.available == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.aws_role.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        if: steps.aws_role.outputs.available == 'true'
        working-directory: infra/terraform
        run: terraform init -backend-config=backend.hcl

      - name: Terraform workspace
        if: steps.aws_role.outputs.available == 'true'
        working-directory: infra/terraform
        run: |
          terraform workspace select "${{ steps.target.outputs.environment }}" \
            || terraform workspace new "${{ steps.target.outputs.environment }}"

      - name: Terraform plan
        if: steps.aws_role.outputs.available == 'true'
        working-directory: infra/terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_certificate_arn: ${{ secrets.CERTIFICATE_ARN }}
        run: |
          terraform plan \
            -var-file="environments/${{ steps.target.outputs.environment }}/terraform.tfvars" \
            -out=tfplan

      - name: Upload Terraform plan
        if: steps.aws_role.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-${{ steps.target.outputs.environment }}-plan
          path: infra/terraform/tfplan
          if-no-files-found: error

      - name: Terraform apply
        if: steps.aws_role.outputs.available == 'true' && github.event_name == 'workflow_dispatch' && inputs.apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

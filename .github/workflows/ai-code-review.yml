name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ai-code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head for diff
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: git fetch --no-tags origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/ai-review-head"

      - name: Check trusted review script
        id: review_script
        run: |
          if [ -f scripts/ai-code-review.mjs ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## AI Code Review"
              echo
              echo "Skipped because trusted base does not contain \`scripts/ai-code-review.mjs\` yet."
              echo "This avoids running pull request code with \`OPENAI_API_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node.js
        if: ${{ steps.review_script.outputs.available == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI code review
        if: ${{ steps.review_script.outputs.available == 'true' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_DIFF_CHARS: 60000
          MAX_FILES: 80
        run: node scripts/ai-code-review.mjs

name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  node-ci:
    name: Node.js CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm typecheck

      - name: Unit Test
        run: pnpm test

      - name: Upload Node Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-results
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore

  rust-ci:
    name: Rust CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Rust Format Check
        working-directory: rust
        run: cargo fmt --all --check

      - name: Rust Clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust Test
        working-directory: rust
        run: cargo test --all

  appium-smoke:
    name: Appium Smoke Test
    runs-on: ubuntu-latest
    needs:
      - node-ci
    if: ${{ false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Start local services
        run: docker compose up -d --build postgres redis user-api user-web

      - name: Run Appium Smoke Test
        run: just test-web-appium-login

      - name: Dump docker logs
        if: always()
        run: docker compose logs > docker-compose.log

      - name: Collect Appium logs
        if: always()
        run: |
          mkdir -p test-results/appium
          cp /tmp/gam-trade/appium.log test-results/appium/appium.log 2>/dev/null || true

      - name: Upload Smoke Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appium-smoke-results
          path: |
            docker-compose.log
            logs/
            test-results/
          if-no-files-found: ignore

      - name: Stop local services
        if: always()
        run: docker compose down -v
